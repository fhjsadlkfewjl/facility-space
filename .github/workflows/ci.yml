name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: office_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U office -d office_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:source
        env:
          TEST_DATABASE_URL: postgres://office:test-password@localhost:5432/office_test
      - run: npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:8080/health
          curl --fail -H 'Authorization: Bearer local-demo-token-only:facilities' http://127.0.0.1:8080/api/dashboard
          curl --fail http://127.0.0.1:8080/
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

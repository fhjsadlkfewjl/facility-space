services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PGHOST: db
      PGDATABASE: office
      PGUSER: office
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_DEMO_TOKEN: ${VITE_DEMO_TOKEN:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
